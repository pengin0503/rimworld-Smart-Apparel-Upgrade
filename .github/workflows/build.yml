name: Validate and build (RimWorld 1.7 development)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate mod metadata and translations
        run: python3 tools/validate_package.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Swap safety regression tests
        run: dotnet run --project Tests/Tests.csproj -c Release
      - name: Restore public reference assemblies
        run: dotnet restore Source/SmartApparelUpgrade.csproj
      - name: Compile (no game files distributed)
        run: dotnet build Source/SmartApparelUpgrade.csproj --configuration Release --no-restore
      - name: Package development mod
        run: python3 tools/package_dev.py
      - uses: actions/upload-artifact@v4
        with:
          name: SmartApparelUpgrade-development-dll
          path: dist/SmartApparelUpgrade-development.zip
          if-no-files-found: error
          retention-days: 7

